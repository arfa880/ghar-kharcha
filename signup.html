<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghar Kharcha - Sign Up</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #f4f7f6; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 400px; }
        h2 { margin-bottom: 1.5rem; text-align: center; color: #1a202c; }
        form p { margin-bottom: 1rem; }
        form label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 0.9rem; color: #4a5568; }
        form input { width: 100%; padding: 0.75rem; border: 1.5px solid #e2e8f0; border-radius: 6px; outline: none; }
        .btn-submit { width: 100%; padding: 0.75rem; background: #3182ce; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 1rem; }
        .btn-submit:hover { background: #2b6cb0; }
        .link-text { text-align: center; margin-top: 1rem; font-size: 0.9rem; }
        .link-text a { color: #3182ce; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
<div class="card">
    <h2>Create Account</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-submit">Sign Up</button>
    </form>
    <div class="link-text">
        Already have an account? <a href="{% url 'login' %}">Login</a>
    </div>
</div>
</body>
</html>
